<style>
/* Affiche: one grotesk (Archivo), black on white, one cobalt accent. Heavy rule under the masthead only; everything else is hairline. */
:root{
  --bg:#FFFFFF; --fg:#0A0A0A; --muted:#5E5E5E; --rule:#0A0A0A; --hair:#D7D7D7; --accent:#2436E0; --accent-fg:#FFFFFF; --soft:#F1F1F1;
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif; --f-body:'Archivo','Helvetica Neue',Arial,sans-serif; --f-ui:'Archivo',Arial,sans-serif;
  /* Type scale: ratio 1.2 from 12.5px. Every size on the page is one of these. */
  --t0:.78rem;    /* 12.5  meta, chips, footer */
  --t1:.9375rem;  /* 15    notes, dates, day heads, deck */
  --t2:1.125rem;  /* 18    titles */
  --t3:1.35rem;   /* 21.6  view tabs */
  --t4:1.625rem;  /* 26    section heads */
  --t5:4.5rem;    /* 72    masthead (poster size, deliberately off-scale) */
  --size:16px; --lh:1.45; --measure:48rem; --note-w:30rem; --when-w:9.75rem;
  --rule-w:3px; --radius:0;
  --wdth-display:88; --wdth-tabs:80;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0C;--fg:#F3F3F1;--muted:#9A9A98;--rule:#F3F3F1;--hair:#2E2E30;--accent:#6B7BFF;--accent-fg:#0B0B0C;--soft:#18181A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0C;--fg:#F3F3F1;--muted:#9A9A98;--rule:#F3F3F1;--hair:#2E2E30;--accent:#6B7BFF;--accent-fg:#0B0B0C;--soft:#18181A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--size);line-height:var(--lh);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 4rem;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:var(--f-ui)}
.wrap{max-width:var(--measure);margin:0 auto}

/* Masthead: name as a block, the week beneath, then the one heavy rule on the page. */
.mast{padding-block:1.5rem .75rem;border-bottom:var(--rule-w) solid var(--rule);display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:1rem}
.mast h1{grid-column:1/-1;font-family:var(--f-display);font-size:var(--t5);font-weight:800;letter-spacing:-.035em;font-variation-settings:'wdth' var(--wdth-display);text-transform:uppercase;margin:0 0 .5rem -.04em;line-height:.95}
.mast .range{grid-column:1/-1;grid-row:2;justify-self:start;font-family:var(--f-ui);font-size:var(--t1);color:var(--muted)}

/* Categories: the primary navigation. Big, condensed, uppercase; wraps to two lines on a phone. */
.chips{display:flex;flex-wrap:wrap;gap:0 1rem;padding-top:.75rem;border-bottom:1px solid var(--rule)}
.chips button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:.25rem 0 .5rem;font-family:var(--f-display);font-size:var(--t3);font-weight:800;letter-spacing:-.015em;text-transform:uppercase;font-variation-settings:'wdth' var(--wdth-tabs);line-height:1;color:var(--muted);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* Views: a quiet line of small text under the categories. */
.views{display:flex;flex-wrap:wrap;gap:.125rem 1.25rem;padding-block:.625rem;border-bottom:1px solid var(--hair);font-family:var(--f-ui);font-size:var(--t1)}
.views button{background:none;border:0;padding:.125rem 0;color:var(--muted);font:inherit;font-weight:500;cursor:pointer;text-decoration:underline transparent;text-decoration-thickness:2px;text-underline-offset:.3em}
.views button[aria-selected="true"]{color:var(--fg);font-weight:700;text-decoration-color:var(--accent)}

/* Sections and days */
#sections section{padding:0}
h3.block{font-family:var(--f-display);font-size:var(--t4);font-weight:800;letter-spacing:-.025em;font-variation-settings:'wdth' var(--wdth-display);line-height:1.05;margin:2.5rem 0 .875rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .75rem}
h3.block:first-child{margin-top:1.75rem}
h3.block small{font-family:var(--f-ui);font-size:var(--t1);font-weight:400;letter-spacing:0;color:var(--muted)}
.day{font-family:var(--f-ui);font-size:var(--t1);font-weight:700;color:var(--fg);line-height:1.3;margin-top:1.75rem;padding-bottom:.375rem;border-bottom:1px solid var(--rule)}
h3.block + .day{margin-top:0}
.ev .meta .cat{display:none}
.all .ev .meta .cat{display:inline}

/* Rows: date | title, venue, note. Hairline between rows; the day head carries the solid rule. */
.ev{display:grid;grid-template-columns:var(--when-w) 1fr;column-gap:1.5rem;padding-block:.875rem;border-top:1px solid var(--hair)}
.day + .ev,section > .ev:first-child{border-top:0}
h3.block + .ev{border-top-color:var(--rule)}
.ev .when{font-family:var(--f-ui);font-size:var(--t1);line-height:1.4;color:var(--muted);padding-top:.1rem;min-width:0}
.ev .what{min-width:0}
.ev .title{font-family:var(--f-display);font-size:var(--t2);font-weight:700;letter-spacing:-.012em;line-height:1.25;text-wrap:balance}
.ev .meta{font-family:var(--f-ui);font-size:var(--t0);line-height:1.4;color:var(--muted);margin-top:.2rem}
.ev .meta .cat{color:var(--accent)}
.ev .note{margin:.375rem 0 0;font-size:var(--t1);line-height:1.45;color:var(--fg);max-width:var(--note-w)}
/* Status words (opens / last day / closes soon) are set as small cobalt words in the date line, not boxes. */
.tag{display:inline-block;font-family:var(--f-ui);font-size:.8em;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1;color:var(--accent);border:0;padding:0;border-radius:var(--radius)}
.tag.lead{margin-right:.45em}
.tag.low{color:var(--muted);font-weight:500;font-size:.85em;letter-spacing:.06em;border:1px solid var(--hair);padding:.1em .35em .05em;margin-left:.5em;vertical-align:.1em}
.title .tag.lead{margin-right:.45em}
.tag.low{font-size:.6em;vertical-align:.2em}
.empty{color:var(--muted);font-size:var(--t1);padding-block:.75rem}

/* Footer */
footer{margin-top:3.5rem;padding-top:.75rem;border-top:1px solid var(--rule);font-family:var(--f-ui);font-size:var(--t0);color:var(--muted);line-height:1.5}
footer > * + *{margin-top:.5rem}
footer ul{margin:.375rem 0 0;padding-left:1.1em}
footer details summary{cursor:pointer;color:var(--fg);font-weight:500}
footer a{text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:.2em}
footer a:hover{text-decoration-color:currentColor}

@media (max-width:560px){
  :root{--t5:3.6rem;--t3:1.2rem;--wdth-tabs:76}
  .chips{gap:0 1rem}
  .mast{padding-top:1.25rem}
  .ev{grid-template-columns:1fr;row-gap:.125rem}
  .ev .when{padding-top:0}
  .ev .note{max-width:none}
}
@media (prefers-reduced-motion:no-preference){a,button{transition:color .15s,border-color .15s,text-decoration-color .15s}}
.day .rel{font-style:normal;color:var(--accent);font-weight:700}
.ev .meta .cat,.all .ev .meta .cat{color:inherit}
</style>

<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var CATS = {exhibition:'Art',theatre:'Theatre',dance:'Dance',music:'Music',opera:'Music',classical:'Music',cinema:'Cinema',talk:'Talks',festival:'Festivals',family:'Family'};
  var CAT_ORDER = ['Art','Theatre','Dance','Music','Cinema','Talks','Festivals','Family'];
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function p(s){ var a=s.split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
  function dayDiff(a,b){ return Math.round((b-a)/864e5); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtD(d,withDay){ return (withDay?DAYS[d.getDay()]+' ':'')+d.getDate()+' '+MONTHS[d.getMonth()]; }
  function fmtRange(s,e,withDay){ var a=p(s),b=p(e); if(s===e) return fmtD(a,withDay);
    if(a.getMonth()===b.getMonth()) return (withDay?DAYS[a.getDay()]+' ':'')+a.getDate()+'–'+b.getDate()+' '+MONTHS[a.getMonth()];
    return fmtD(a,withDay)+' – '+fmtD(b,withDay); }
  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  var now = new Date(); var today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var weekEnd = new Date(today); weekEnd.setDate(today.getDate()+6);
  var comingEnd = new Date(today); comingEnd.setDate(today.getDate()+41);
  document.getElementById('range').textContent = fmtD(today,true)+' – '+fmtD(weekEnd,true)+' '+today.getFullYear();

  // Classify
  var ev = D.events.map(function(e){ e._s=p(e.start); e._e=p(e.end||e.start); e._cat=CATS[e.category]||'Other'; e._len=dayDiff(e._s,e._e); return e; })
    .filter(function(e){ return e._e>=today; });
  var afield = ev.filter(function(e){return e.region==='afield';});
  var local = ev.filter(function(e){return e.region!=='afield';});
  var longRun = function(e){ return e._len>=21; };
  var onNow = local.filter(function(e){ return longRun(e) && e._s<=weekEnd; }).sort(function(a,b){return a._e-b._e;});
  // Long runs appear in This week only on the week they open or the week they close.
  var opening = local.filter(function(e){ return longRun(e) && e._s>=today && e._s<=weekEnd; }).map(function(e){ var c=Object.create(e); c._mode='opens'; return c; });
  var closing = local.filter(function(e){ return longRun(e) && e._s<today && e._e<=weekEnd; }).map(function(e){ var c=Object.create(e); c._mode='last'; c._s=e._e; return c; });
  var week = local.filter(function(e){ return !longRun(e) && e._s<=weekEnd; }).concat(opening,closing)
    .sort(function(a,b){ return (a._s<today?today:a._s)-(b._s<today?today:b._s) || (a.time||'').localeCompare(b.time||''); });
  var coming = local.filter(function(e){ return e._s>weekEnd && e._s<=comingEnd; }).sort(function(a,b){return a._s-b._s;});

  function row(e,opts){ opts=opts||{};
    var when;
    if(opts.mode==='now'){ var left=dayDiff(today,e._e); when='until '+fmtD(e._e)+(left<=14?' <span class="tag">closes soon</span>':''); }
    else if(opts.mode==='week'){ var st=e._s<today?today:e._s;
      if(e._mode==='opens') when='<span class="tag lead">opens</span>'+fmtD(e._s,true)+' · until '+fmtD(e._e)+(e.time?' · '+e.time:'');
      else if(e._mode==='last') when='<span class="tag lead">last day</span>'+fmtD(e._e,true);
      else if(e._len===0) when=fmtD(e._s,true)+(e.time?' · '+e.time:'');
      else if(e._e<=weekEnd) when=fmtRange(iso(st),e.end,true)+(e.time?' · '+e.time:'');
      else when='from '+fmtD(st,true)+' · until '+fmtD(e._e)+(e.time?' · '+e.time:''); }
    else { when = fmtRange(e.start,e.end,true)+(e.time&&e._len===0?' · '+e.time:''); }
    var where = esc(e.venue)+(e.town?', '+esc(e.town):'');
    return '<article class="ev"><div class="when">'+when+'</div><div class="what">'
      +'<div class="title"><a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.title)+'</a>'+(e.confidence==='low'?'<span class="tag low">check</span>':'')+'</div>'
      +'<div class="meta">'+where+'<span class="cat"> · '+e._cat+'</span></div>'
      +(e.note?'<p class="note">'+esc(e.note)+'</p>':'')+'</div></article>';
  }
  var activeCat='All', activeView='now';
  function weekList(list){ var html='',lastDay='';
    list.forEach(function(e){ var st=e._s<today?today:e._s; var key=st.toDateString(); if(key!==lastDay){ html+='<div class="day">'+fmtD(st,true)+(dayDiff(today,st)===0?' <em class="rel">today</em>':dayDiff(today,st)===1?' <em class="rel">tomorrow</em>':'')+'</div>'; lastDay=key; } html+=row(e,{mode:'week'}); });
    return html; }
  function render(){
    var f=function(e){ return activeCat==='All'||e._cat===activeCat; };
    var h='';
    if(activeView==='now'){
      var w=week.filter(f), still=onNow.filter(f).filter(function(e){return e._e>weekEnd && e._s<today;});
      h+='<section id="s-now">';
      h+='<h3 class="block">This week</h3>'+(w.length?weekList(w):'<div class="empty">Nothing dated in this category this week.</div>');
      h+='<h3 class="block">Still on <small>by closing date</small></h3>'+(still.length?still.map(function(e){return row(e,{mode:'now'});}).join(''):'<div class="empty">Nothing continuing in this category.</div>');
      h+='</section>';
    } else if(activeView==='coming'){
      var c=coming.filter(f);
      h+='<section id="s-coming">'+(c.length?c.map(function(e){return row(e,{mode:'coming'});}).join(''):'<div class="empty">Nothing announced yet in this category.</div>')+'</section>';
    } else {
      var a=afield.filter(f).sort(function(x,y){return (x._s<today?today:x._s)-(y._s<today?today:y._s);});
      h+='<section id="s-afield">'+(a.length?a.map(function(e){return row(e,{mode:e._len>=21&&e._s<=today?'now':'coming'});}).join(''):'<div class="empty">Nothing further afield in this category.</div>')+'</section>';
    }
    var box=document.getElementById('sections'); box.innerHTML=h; box.className=activeCat==='All'?'all':'';
  }
  // Views
  function setView(v){ activeView=v; Array.prototype.forEach.call(document.querySelectorAll('#views button'),function(b){b.setAttribute('aria-selected',b.getAttribute('data-view')===v);}); render(); }
  Array.prototype.forEach.call(document.querySelectorAll('#views button'),function(b){ b.addEventListener('click',function(){ setView(b.getAttribute('data-view')); }); });
  // Chips: category filter
  var present = {}; ev.forEach(function(e){present[e._cat]=1;});
  var chips=document.getElementById('chips');
  ['All'].concat(CAT_ORDER.filter(function(c){return present[c];})).forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.textContent=c; b.id='chip-'+c.toLowerCase(); b.setAttribute('aria-pressed',c===activeCat);
    b.addEventListener('click',function(){ activeCat=c; Array.prototype.forEach.call(chips.children,function(x){x.setAttribute('aria-pressed',x.textContent===c);}); render(); });
    chips.appendChild(b);
  });
  // Footer
  document.getElementById('updated').innerHTML = 'Listings gathered '+esc(D.updated)+', '+D.events.length+' entries.<br>Next edition '+esc(D.next_update)+'.';
  document.getElementById('changelog').innerHTML = (D.changelog||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join('')||'<li>First edition.</li>';
  document.getElementById('sources').innerHTML = (D.sources||[]).map(function(s){return '<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a></li>';}).join('');
  var h0=(location.hash||'').replace('#',''); setView(['now','coming','afield'].indexOf(h0)>-1?h0:'now');
})();
</script>
